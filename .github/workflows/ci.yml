name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Seed both environments
        run: bun run seed

      - name: Smoke test
        run: |
          WEB_PORT=3100 bun run start > /tmp/dashboard.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3100/api/demo/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3100/ > /dev/null
          curl -fsS http://localhost:3100/demo > /dev/null
          curl -fsS http://localhost:3100/api/tabs > /dev/null
          curl -fsS http://localhost:3100/api/demo/health
