<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Sentiment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Header -->
    <div class="header">
      <span class="header-title">Sentiment</span>
      <button class="btn-add" id="addBtn" title="Add entry">+</button>
    </div>

    <!-- Global -->
    <div class="global-block">
      <div class="global-meta">
        <span class="global-score" id="globalScore">—</span>
        <span class="global-label" id="globalLabel">No data</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="globalFill" style="width:50%"></div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Sources -->
    <div class="sources" id="sources">
      <!-- rendered by JS -->
    </div>

  </div>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title">New entry</div>
      <form id="sentimentForm">
        <div class="field">
          <label>Source</label>
          <select id="fSource" required>
            <option value="">— choose —</option>
            <option value="twitter">X / Twitter</option>
            <option value="reddit">Reddit</option>
            <option value="youtube">YouTube</option>
            <option value="trends">Trends</option>
          </select>
        </div>
        <div class="field">
          <label>Topic / Content</label>
          <input type="text" id="fContent" placeholder="e.g. Product launch reaction" required>
        </div>
        <div class="field">
          <label>Score <span id="fScoreVal" style="font-weight:600">0</span></label>
          <div class="slider-wrap">
            <span style="opacity:.4;font-size:11px">−5</span>
            <input type="range" id="fScore" min="-5" max="5" value="0">
            <span style="opacity:.4;font-size:11px">+5</span>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-submit">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const instanceId = params.get('instanceId');
    const tabId = params.get('tabId');
    const config = JSON.parse(params.get('config') || '{}');

    let _resolvedConfig = {};
    const _configChangeCallbacks = [];

    async function resolveConfig(rawConfig) {
      rawConfig = rawConfig || config;
      const resolved = {};
      const varRefs = {};
      for (const [key, val] of Object.entries(rawConfig)) {
        if (typeof val === 'string' && val.startsWith('$var:')) {
          const varName = val.replace('$var:', '');
          varRefs[key] = varName;
          resolved[key] = await getVar(varName);
        } else {
          resolved[key] = val;
        }
      }
      for (const [key, varName] of Object.entries(varRefs)) {
        watchVar(varName, (newValue) => {
          _resolvedConfig[key] = newValue;
          _configChangeCallbacks.forEach(cb => cb({ ..._resolvedConfig }, key, newValue));
        });
      }
      _resolvedConfig = resolved;
      return resolved;
    }

    function onConfigChange(callback) {
      _configChangeCallbacks.push(callback);
      return () => {
        const idx = _configChangeCallbacks.indexOf(callback);
        if (idx !== -1) _configChangeCallbacks.splice(idx, 1);
      };
    }

    async function queryDB(query) {
      const res = await fetch(`/api/tabs/${tabId}/widgets/${instanceId}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(query)
      });
      const result = await res.json();
      if (!result.success) throw new Error(result.error);
      return result.data;
    }

    async function sendNotification(options) {
      const { title, message, type = 'widget', duration = 5000, scope = 'global' } = options;
      const res = await fetch(`/api/tabs/${tabId}/widgets/${instanceId}/notify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, message, type, duration })
      });
      const result = await res.json();
      if (!result.success) throw new Error(result.error);
      if (window.parent) {
        window.parent.postMessage({
          type: 'widget-notification',
          notification: { title: title || result.notification.widgetName, message, type, duration, icon: result.notification.widgetEmoji, scope }
        }, '*');
      }
      return result;
    }

    let _tabVariables = {};
    async function loadTabVariables() {
      try { const res = await fetch(`/api/tabs/${tabId}/variables`); _tabVariables = await res.json(); return _tabVariables; }
      catch (err) { return {}; }
    }
    async function getVar(key) {
      try { const res = await fetch(`/api/tabs/${tabId}/variables/${key}`); const data = await res.json(); return data.value; }
      catch { return null; }
    }
    async function setVar(key, value) {
      try { await fetch(`/api/tabs/${tabId}/variables/${key}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value }) }); _tabVariables[key] = value; return true; }
      catch { return false; }
    }
    const _varWatchers = {};
    function watchVar(key, callback) {
      if (!_varWatchers[key]) _varWatchers[key] = [];
      _varWatchers[key].push(callback);
      return () => { _varWatchers[key] = _varWatchers[key].filter(cb => cb !== callback); };
    }
    window.addEventListener('message', (event) => {
      if (event.data.type === 'tab-variable-changed') {
        const { key, value } = event.data;
        _tabVariables[key] = value;
        if (_varWatchers[key]) _varWatchers[key].forEach(cb => cb(value, key));
      }
    });
    loadTabVariables();
  </script>
  <script src="app.js"></script>
</body>
</html>
