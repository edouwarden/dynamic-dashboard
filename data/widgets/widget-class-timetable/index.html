<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Timetable</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="timetable">
    <header class="head">
      <div class="title"><span class="icon">🗓️</span><h1>Timetable</h1></div>
      <span class="week" id="week">—</span>
    </header>
    <div class="days" id="days"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const instanceId = params.get('instanceId');
    const tabId = params.get('tabId');
    const lang = params.get('lang') || document.documentElement.lang || 'en';

    async function queryDB(query) {
      const res = await fetch(`/api/tabs/${tabId}/widgets/${instanceId}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(query)
      });
      const result = await res.json();
      if (!result.success) throw new Error(result.error);
      return result.data;
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
