<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Trigger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-family, 'Inter', sans-serif);
      background: var(--color-bg, #1a1a2e);
      color: var(--color-text, #e2e8f0);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      padding: 8px;
    }

    .trigger-btn {
      width: 100%;
      height: 100%;
      background: var(--color-primary, #3b82f6);
      color: white;
      border: none;
      border-radius: var(--border-radius, 8px);
      font-family: inherit;
      font-size: clamp(12px, 3vmin, 22px);
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
      line-height: 1.2;
      overflow: hidden;
      word-break: break-word;
      text-align: center;
      padding: 4px 8px;
    }

    .trigger-btn:hover:not(:disabled) { opacity: 0.85; transform: scale(0.98); }
    .trigger-btn:active:not(:disabled) { opacity: 0.75; transform: scale(0.96); }
    .trigger-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      background: var(--color-border, #444);
    }

    .trigger-btn .icon {
      font-size: 1.3em;
      flex-shrink: 0;
    }

    .trigger-btn.running .icon { animation: spin 1s linear infinite; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <button class="trigger-btn" id="triggerBtn" disabled>
    <span class="icon" id="btnIcon">▶</span>
    <span id="btnLabel">...</span>
  </button>

  <script>
    const params = new URLSearchParams(window.location.search);
    let config = {};
    try { config = JSON.parse(decodeURIComponent(params.get('config') || '{}')); } catch(e) {}

    const scriptId = config.scriptId || '';
    const btn = document.getElementById('triggerBtn');
    const icon = document.getElementById('btnIcon');
    const label = document.getElementById('btnLabel');

    async function init() {
      if (!scriptId) {
        label.textContent = config.label || 'Exécuter';
        btn.disabled = true;
        return;
      }

      try {
        const res = await fetch(`/api/scripts/${scriptId}`);
        if (!res.ok) throw new Error();
        const script = await res.json();
        icon.textContent = script.emoji || '▶';
        label.textContent = config.label || script.name || 'Exécuter';
        btn.disabled = false;
      } catch(e) {
        icon.textContent = '❓';
        label.textContent = config.label || 'Exécuter';
        btn.disabled = true;
      }
    }

    async function runScript() {
      if (!scriptId || btn.disabled) return;
      btn.disabled = true;
      btn.classList.add('running');
      icon.textContent = '⏳';

      try {
        const res = await fetch(`/api/scripts/${scriptId}/run`, { method: 'POST' });
        const data = await res.json();
        if (data.status === 'success') {
          icon.textContent = '✅';
          label.textContent = config.label || label.textContent;
          setTimeout(() => restoreBtn(), 1500);
        } else {
          icon.textContent = '❌';
          setTimeout(() => restoreBtn(), 2000);
        }
      } catch(e) {
        icon.textContent = '❌';
        setTimeout(() => restoreBtn(), 2000);
      }
    }

    function restoreBtn() {
      btn.classList.remove('running');
      init();
    }

    btn.addEventListener('click', runScript);
    init();
  </script>
</body>
</html>
